# SisPro Platform — VPS (Ubuntu + Nginx + Docker)
# Subdomínios sugeridos (ajuste DNS A → IP da VPS):
#   sispro.techartsolucoes.com.br          → painel + app estático
#   sispro-grafana.techartsolucoes.com.br  → Grafana
#   sispro-api.techartsolucoes.com.br      → connector :3080

services:
  postgres:
    image: postgres:16-alpine
    container_name: sispro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sispro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sispro_piloto_troque}
      POSTGRES_DB: sispro
    volumes:
      - sispro_pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sispro -d sispro"]
      interval: 5s
      timeout: 5s
      retries: 10
    # sem publish público — só rede Docker
    networks: [sispro_net]

  connector:
    build: ./connector
    container_name: sispro-connector
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sispro:${POSTGRES_PASSWORD:-sispro_piloto_troque}@postgres:5432/sispro
      PORT: "3080"
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    ports:
      - "127.0.0.1:3080:3080"
    networks: [sispro_net]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: sispro-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-troque_esta_senha}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST:-sispro-grafana.techartsolucoes.com.br}
      GF_SERVER_DOMAIN: ${GRAFANA_HOST:-sispro-grafana.techartsolucoes.com.br}
      GF_INSTALL_PLUGINS: ""
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - sispro_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [sispro_net]

  # App estático SisPro + painel liderança (servido por nginx container, proxyado pelo host)
  web:
    image: nginx:1.27-alpine
    container_name: sispro-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3081:80"
    volumes:
      - ./web-dist:/usr/share/nginx/html:ro
      - ./deploy/nginx-web.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [sispro_net]

volumes:
  sispro_pg_data:
  sispro_grafana_data:

networks:
  sispro_net:
    driver: bridge
